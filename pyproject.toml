[build-system]
requires = ["setuptools>=46.4"]
build-backend = "setuptools.build_meta"

[project]
name = "ewoksutils"
version = "1.10.0"
authors = [{name = "ESRF", email = "dau-pydev@esrf.fr"}]
description = "Utilities for ewoks developers"
readme = {file = "README.md", content-type = "text/markdown"}
license = {file = "LICENSE.md"}
classifiers = [
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
requires-python = ">=3.8"

[project.urls]
Homepage = "https://github.com/ewoks-kit/ewoksutils/"
Documentation = "https://ewoksutils.readthedocs.io/"
Repository = "https://github.com/ewoks-kit/ewoksutils/"
Issues = "https://github.com/ewoks-kit/ewoksutils/issues/"
Changelog = "https://github.com/ewoks-kit/ewoksutils/blob/main/CHANGELOG.md"

[project.optional-dependencies]
full = [
    "click"
]
test = [
    "ewoksutils[full]",
    "pytest >=7",
]
dev = [
    "ewoksutils[test]",
    "ruff",
]
doc = [
    "sphinx >=4.5",
    "sphinx-autodoc-typehints >=1.16",
    "pydata-sphinx-theme",
    "sphinx-copybutton",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.coverage.run]
omit = ["*/tests/*"]

[[tool.mypy.overrides]]
module = "setuptools.*"
ignore_missing_imports = true

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Ignore `S101` (assert used violations) in all test files
"src/ewoks/tests/*.py" = ["S101"]

[tool.ruff.lint.isort]
force-single-line = true
